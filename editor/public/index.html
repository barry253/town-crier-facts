<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Town Crier Local Facts Editor</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #111; background: #fff; display: flex; height: 100vh; }
    aside { width: 390px; border-right: 1px solid #ddd; background: #fafafa; padding: 14px; overflow-y: auto; flex-shrink: 0; }
    main { flex: 1; padding: 20px; overflow-y: auto; min-width: 0; }
    h1, h2, h3 { margin-top: 0; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; }
    textarea { min-height: 90px; line-height: 1.4; font-family: Arial, sans-serif; resize: vertical; }
    button { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 9px 11px; cursor: pointer; font-size: 14px; }
    button:hover { background: #eee; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button.danger { border-color: #c62828; color: #c62828; }
    button.small { padding: 6px 8px; font-size: 12px; }
    .filters { display: grid; gap: 8px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row > * { flex: 1; }
    .row button { flex: 0 0 auto; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .state-group { margin: 8px 0; }
    .state-group-header { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: .06em; padding: 4px 0 2px; border-bottom: 1px solid #eee; margin-bottom: 4px; }
    .landmark-card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 14px 0; background: #fff; }
    .landmark-card.approved { border-left: 5px solid #2e7d32; }
    .landmark-card.draft { border-left: 5px solid #bbb; }
    .lm-type { display: inline-block; border: 1px solid #bbb; border-radius: 999px; padding: 2px 7px; font-size: 11px; color: #555; background: #f5f5f5; margin-left: 6px; vertical-align: middle; }
    .lm-thumb { border-radius: 8px; max-width: 110px; max-height: 80px; object-fit: cover; display: block; margin-top: 4px; }
    .lm-coords { font-size: 11px; color: #999; margin: 4px 0 0; }
    .lm-status-badge { display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; user-select: none; border: 1px solid; }
    .lm-status-badge.approved { color: #1b5e20; border-color: #a5d6a7; background: #e8f5e9; }
    .lm-status-badge.draft { color: #666; border-color: #ccc; background: #f5f5f5; }
    .bridge-item { border: 1px solid #ddd; border-radius: 8px; padding: 9px 10px; margin: 5px 0; cursor: pointer; }
    .bridge-item:hover { background: #f1f1f1; }
    .bridge-item.active { border-color: #111; background: #f2f2f2; }
    .bridge-item.approved { border-left: 4px solid #2e7d32; }
    .bridge-item.blocked { border-left: 4px solid #c62828; opacity: 0.6; }
    .bridge-title { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bridge-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
    .bridge-type { display: inline-block; border: 1px solid #bbb; border-radius: 999px; padding: 1px 6px; font-size: 11px; color: #555; background: #f5f5f5; }
    .bridge-type.bridge { color: #1565c0; border-color: #90caf9; background: #e3f2fd; }
    .bridge-type.tunnel { color: #4a148c; border-color: #ce93d8; background: #f3e5f5; }
    .bridge-type.unknown { color: #666; }
    .bridge-decision { display: inline-block; border-radius: 999px; padding: 1px 7px; font-size: 11px; border: 1px solid; }
    .bridge-decision.approved { color: #1b5e20; border-color: #a5d6a7; background: #e8f5e9; }
    .bridge-decision.blocked { color: #b71c1c; border-color: #ef9a9a; background: #ffebee; }
    .bridge-decision.undecided { color: #888; border-color: #ddd; background: #f5f5f5; }
    .bridge-p31 { font-size: 10px; color: #aaa; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bridge-detail-meta { color: #666; font-size: 13px; margin: 4px 0 12px; }
    .bridge-extract { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: #333; margin: 10px 0 14px; max-height: 220px; overflow-y: auto; }
    .bridge-thumbnail { float: right; max-width: 120px; max-height: 90px; object-fit: cover; border-radius: 6px; margin-left: 12px; margin-bottom: 6px; }
    .bridge-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 8px; }
    button.approve-btn { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; font-weight: bold; }
    button.approve-btn:hover { background: #c8e6c9; }
    button.approve-btn.active-decision { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    button.block-btn { background: #ffebee; color: #b71c1c; border-color: #ef9a9a; font-weight: bold; }
    button.block-btn:hover { background: #ffcdd2; }
    button.block-btn.active-decision { background: #c62828; color: #fff; border-color: #c62828; }
    .bridge-history { font-size: 12px; color: #888; margin-top: 8px; }
    .bridge-connecting-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; padding: 8px 10px; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 8px; }
    .bridge-connecting-row label { font-size: 13px; font-weight: bold; white-space: nowrap; color: #555; flex-shrink: 0; }
    .bridge-connecting-row input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
    .bridge-connecting-row input[type=text]:focus { outline: none; border-color: #555; }
    .bridge-facts-section { margin: 16px 0 0; border-top: 1px solid #eee; padding-top: 12px; }
    .bridge-facts-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 8px; }
    .bridge-fact-row { display: flex; gap: 6px; align-items: flex-start; margin: 5px 0; }
    .bridge-fact-num { font-size: 12px; color: #aaa; min-width: 20px; padding-top: 11px; flex-shrink: 0; }
    .bridge-fact-row textarea { min-height: 52px; resize: vertical; font-size: 13px; }
    .bridge-fact-del { flex-shrink: 0; padding: 6px 9px; font-size: 13px; line-height: 1; color: #b71c1c; border-color: #ef9a9a; }
    .bridge-fact-del:hover { background: #ffebee; }
    .bridge-fact-empty { color: #aaa; font-size: 13px; font-style: italic; margin: 6px 0; }
    button.undecided-btn { background: #f5f5f5; color: #555; border-color: #ccc; font-weight: bold; }
    button.undecided-btn:hover { background: #eee; }
    button.undecided-btn.active-decision { background: #616161; color: #fff; border-color: #616161; }
    .bridge-filter-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .bridge-filter-row select { flex: 1; padding: 7px 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
    .bridge-batch-btn { font-size: 12px; padding: 6px 8px; white-space: nowrap; width: 100%; text-align: left; }
    .bridge-batch-btn.approve { border-color: #a5d6a7; color: #1b5e20; }
    .bridge-batch-btn.approve:hover { background: #e8f5e9; }
    .bridge-batch-btn.block { border-color: #ef9a9a; color: #b71c1c; }
    .bridge-batch-btn.block:hover { background: #ffebee; }
    .bridge-batch-btn.reset { border-color: #bdbdbd; color: #555; }
    .bridge-batch-btn.reset:hover { background: #f5f5f5; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #fff; border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal-box h3 { margin-top: 0; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .kbd-hint { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.7; }
    .tabs button.active { background: #111; color: #fff; }
    .summary { color: #666; font-size: 13px; margin: 6px 0 10px; }
    .town-list button { width: 100%; margin: 5px 0; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
    .town-list button.active { background: #e6e6e6; font-weight: bold; }
    .town-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: #666; white-space: nowrap; font-size: 12px; }
    .problem-item { border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 10px; margin: 8px 0; cursor: pointer; }
    .problem-item:hover { background: #f1f1f1; }
    .problem-item.active { border-color: #111; background: #f2f2f2; }
    .problem-text { font-size: 13px; color: #333; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .muted { color: #666; font-size: 13px; }
    .fact-card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin: 14px 0; background: #fff; }
    .fact-card.bad { background: #fff6f6; border-left: 5px solid #c62828; }
    .fact-card.warning { background: #fffaf0; border-left: 5px solid #f9a825; }
    .fact-card.weak { background: #f7f7f7; border-left: 5px solid #999; }
    .fact-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .flags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .flag { border: 1px solid #ccc; border-radius: 999px; padding: 3px 7px; font-size: 12px; background: #fff; }
    .flag.bad { color: #b71c1c; border-color: #ef9a9a; background: #ffebee; }
    .flag.warning { color: #7a5200; border-color: #ffe082; background: #fff8e1; }
    .flag.weak { color: #555; border-color: #ccc; background: #f5f5f5; }
    .flag.reviewed { color: #1b5e20; border-color: #a5d6a7; background: #e8f5e9; }
    .field { margin: 9px 0; }
    .field label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button.publish { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
    button.publish:hover { background: #155230; }
    button.publish:disabled { background: #6aaa88; border-color: #6aaa88; cursor: not-allowed; }
    .publish-log { background: #1a1a1a; color: #d0d0d0; font-family: monospace; font-size: 12px; line-height: 1.6; padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; max-height: 200px; overflow-y: auto; }
    .step-ok { color: #69db7c; }
    .step-error { color: #ff6b6b; }
    .step-pending { color: #999; }
    .step-skipped { color: #ffd43b; }
    .step-output { color: #888; font-size: 11px; display: block; padding-left: 16px; white-space: pre-wrap; }
    .drag-handle { cursor: grab; color: #bbb; font-size: 18px; margin-right: 8px; user-select: none; flex-shrink: 0; line-height: 1; padding: 2px 4px; }
    .drag-handle:hover { color: #555; }
    .fact-card.drag-over { outline: 2px solid #666; background: #f0f4f8 !important; }
    .fact-card.dragging { opacity: 0.4; }
    .status { position: sticky; bottom: 0; background: #111; color: #fff; padding: 9px 12px; border-radius: 8px; margin-top: 12px; display: none; }
    .status.show { display: block; }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .git { font-size: 12px; color: #666; white-space: pre-wrap; background: #f5f5f5; padding: 8px; border-radius: 8px; margin-top: 8px; }
    @media (max-width: 800px) {
      body { display: block; height: auto; }
      aside { width: 100%; max-height: 48vh; border-right: none; border-bottom: 1px solid #ddd; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <aside>
    <h2>Local Facts Editor</h2>
    <div class="tabs">
      <button id="tabProblems" class="active">Problem Queue</button>
      <button id="tabAll">All Towns</button>
      <button id="tabLandmarks">Landmarks</button>
      <button id="tabBridges">Bridges</button>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Search town, fact, source, slug" />
      <div class="row">
        <select id="stateFilter"><option value="">All states/groups</option></select>
        <select id="qaFilter">
          <option value="issues">Issues</option>
          <option value="bad">Bad</option>
          <option value="warning">Warnings</option>
          <option value="weak">Weak</option>
          <option value="low-count">Low count</option>
          <option value="all">All</option>
        </select>
      </div>
      <button id="refreshBtn">Refresh</button>
      <button id="gitBtn">Check Git Status</button>
    </div>
    <div class="summary" id="summary">Loading...</div>
    <div class="git" id="gitStatus" style="display:none"></div>
    <div id="bridgeFilters" style="display:none">
      <div class="bridge-filter-row">
        <select id="bridgeDecisionFilter">
          <option value="all">All decisions</option>
          <option value="undecided">Undecided</option>
          <option value="approved">Approved</option>
          <option value="blocked">Blocked</option>
        </select>
        <select id="bridgeTypeFilter">
          <option value="all">All types</option>
          <option value="bridge">Bridge</option>
          <option value="tunnel">Tunnel</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>
      <div class="bridge-filter-row">
        <select id="bridgeCountryFilter"><option value="all">All countries</option></select>
        <select id="bridgeStateFilter"><option value="all">All states</option></select>
      </div>
      <button class="bridge-batch-btn approve" id="batchApproveBtn" style="display:none"></button>
      <button class="bridge-batch-btn block" id="batchBlockBtn" style="display:none"></button>
      <button class="bridge-batch-btn reset" id="batchResetBtn" style="display:none"></button>
      <div class="kbd-hint">j/k navigate · a approve · b block · u undecided · / search</div>
    </div>
    <div id="list" class="town-list">Loading...</div>
  </aside>
  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button id="modalConfirm" class="danger">Confirm</button>
      </div>
    </div>
  </div>

  <main>
    <div class="topbar">
      <div>
        <h1 id="title">Select a town or problem fact</h1>
        <div class="muted" id="subtitle">Edits save directly to local JSON files and rebuild the index.</div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
        <button id="addFactBtn" style="display:none">Add Fact</button>
        <button id="publishBtn" class="publish">Publish</button>
      </div>
    </div>
    <div id="publishLog" class="publish-log" style="display:none"></div>
    <div id="facts"></div>
    <div id="status" class="status"></div>
  </main>

  <script>
    let towns = [];
    let problemFacts = [];
    let mode = 'problems';
    let currentFile = null;
    let currentTownPayload = null;
    let lmCollections = [];
    let currentLmState = null;
    let currentLmFile = null;
    let currentLmData = null;
    let dragSrcFactIndex = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function showStatus(message, isError=false){
      const el = $('status');
      el.textContent = message;
      el.style.background = isError ? '#b71c1c' : '#111';
      el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'), 4500);
    }

    async function api(path, options){
      const res = await fetch(path, options);
      const json = await res.json().catch(()=>({}));
      if(!res.ok || json.ok === false) throw new Error(json.error || `Request failed: ${res.status}`);
      return json;
    }

    function townLabel(t){ return t.place || [t.town, t.state].filter(Boolean).join(', ') || t.slug || t.file; }
    function groupLabel(t){ return t.state || t.country || 'Other'; }

    async function loadAll(){
      towns = await api('/api/index');
      towns.sort((a,b)=>townLabel(a).localeCompare(townLabel(b)));
      problemFacts = await api('/api/problem-facts');
      buildStateFilter();
      renderList();
    }

    function buildStateFilter(){
      const current = $('stateFilter').value;
      const groups = [...new Set(towns.map(groupLabel))].sort();
      $('stateFilter').innerHTML = '<option value="">All states/groups</option>' + groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
      $('stateFilter').value = current;
    }

    function matchesQueryText(text){
      const q = $('search').value.trim().toLowerCase();
      return !q || String(text || '').toLowerCase().includes(q);
    }

    function renderList(){
      if (mode === 'landmarks') { renderLmList(); return; }
      if (mode === 'bridges') { renderBridgesList(); return; }
      const list = $('list');
      const state = $('stateFilter').value;
      const qa = $('qaFilter').value;
      list.innerHTML = '';

      if(mode === 'problems'){
        const visible = problemFacts.filter(f => {
          if(state && f.state !== state) return false;
          if(qa === 'bad' && !f.flags?.some(x=>x.severity==='bad')) return false;
          if(qa === 'warning' && !f.flags?.some(x=>x.severity==='warning')) return false;
          if(qa === 'weak' && !f.flags?.some(x=>x.severity==='weak')) return false;
          if(qa === 'low-count') {
            const town = towns.find(t=>t.file===f.file);
            if(!town || town.factCount >= 6) return false;
          }
          if(qa === 'issues' && !(f.flags?.length)) return false;
          return matchesQueryText([f.place, f.town, f.state, f.slug, f.file, f.text, f.source, ...(f.sourceLabels||[])].join(' '));
        });
        $('summary').textContent = `${visible.length} problem facts shown · ${problemFacts.length} total problem facts`;
        if(!visible.length){ list.innerHTML = '<div class="muted">No problem facts match.</div>'; return; }
        visible.slice(0, 500).forEach(f=>{
          const div = document.createElement('div');
          div.className = 'problem-item' + (currentFile===f.file ? ' active' : '');
          div.innerHTML = `<b>${esc(f.place || f.file)}</b><div class="muted">Fact #${f.factNumber} · ${esc(f.file)}</div><div class="flags">${(f.flags||[]).map(flag=>`<span class="flag ${flag.severity}">${esc(flag.label)}</span>`).join('')}</div><div class="problem-text">${esc(f.text)}</div>`;
          div.onclick = ()=>loadTown(f.file, f.factIndex);
          list.appendChild(div);
        });
        return;
      }

      const visible = towns.filter(t=>{
        if(state && groupLabel(t) !== state) return false;
        if(qa === 'issues' && !(t.badCount || t.warningCount || t.weakCount)) return false;
        if(qa === 'bad' && !t.badCount) return false;
        if(qa === 'warning' && !t.warningCount) return false;
        if(qa === 'weak' && !t.weakCount) return false;
        if(qa === 'low-count' && t.factCount >= 6) return false;
        return matchesQueryText([townLabel(t), t.town, t.state, t.country, t.slug, t.file].join(' '));
      });
      $('summary').textContent = `${visible.length} of ${towns.length} towns`;
      if(!visible.length){ list.innerHTML = '<div class="muted">No towns match.</div>'; return; }
      visible.slice(0, 700).forEach(t=>{
        const btn = document.createElement('button');
        btn.className = currentFile===t.file ? 'active' : '';
        btn.innerHTML = `<span class="town-title">${esc(townLabel(t))}</span><span class="count">${t.factCount||0} facts${t.badCount?` · ${t.badCount} bad`:''}${t.warningCount?` · ${t.warningCount} warn`:''}</span>`;
        btn.onclick = ()=>loadTown(t.file);
        list.appendChild(btn);
      });
    }

    async function loadTown(file, focusFactIndex=null){
      currentFile = file;
      currentTownPayload = await api(`/api/town/${encodeURIComponent(file)}`);
      renderTown(focusFactIndex);
      renderList();
    }

    function renderTown(focusFactIndex=null){
      const { town, json, facts } = currentTownPayload;
      $('title').textContent = json.place || townLabel(town || {file: currentFile});
      $('subtitle').textContent = `${currentFile} · ${facts.length} facts`;
      $('addFactBtn').style.display = 'inline-block';
      const el = $('facts');
      el.innerHTML = '';
      if(!facts.length) el.innerHTML = '<div class="muted">No facts yet.</div>';
      facts.forEach((f)=>{
        const card = document.createElement('div');
        card.className = `fact-card ${f.worst||''}`.trim();
        card.id = `fact-${f.factIndex}`;
        card.setAttribute('draggable', 'true');
        card.dataset.factIndex = f.factIndex;
        const reviewedBadge = f.reviewed ? '<span class="flag reviewed">Reviewed</span>' : '';
        card.innerHTML = `
          <div class="fact-head">
            <span class="drag-handle" title="Drag to reorder">⠿</span>
            <b>Fact #${f.factNumber}</b>
            <div class="muted">index ${f.factIndex}</div>
          </div>
          <div class="flags">${reviewedBadge}${(f.flags||[]).map(flag=>`<span class="flag ${flag.severity}">${esc(flag.label)}</span>`).join('')}</div>
          <div class="field"><label>Fact text</label><textarea data-field="text">${esc(f.text)}</textarea></div>
          <div class="field"><label>Source URL</label><input data-field="source" value="${esc(f.source)}" /></div>
          <div class="field"><label>Source labels, comma-separated</label><input data-field="sourceLabels" value="${esc((f.sourceLabels||[]).join(', '))}" /></div>
          <div class="field"><label>Review notes</label><input data-field="notes" value="${esc(f.review?.notes || '')}" placeholder="Optional notes" /></div>
          <div class="actions">
            <button class="primary" data-action="save">Save</button>
            <button data-action="approve">Approve</button>
            <button data-action="ignore">Ignore Flag</button>
            <button data-action="needs">Needs Fix</button>
            <button class="danger" data-action="delete">Delete</button>
          </div>
        `;
        card.querySelector('[data-action="save"]').onclick = ()=>saveFact(f.factIndex, card);
        card.querySelector('[data-action="approve"]').onclick = ()=>reviewFact(f.factIndex, 'approved', card);
        card.querySelector('[data-action="ignore"]').onclick = ()=>reviewFact(f.factIndex, 'ignore_flag', card);
        card.querySelector('[data-action="needs"]').onclick = ()=>reviewFact(f.factIndex, 'needs_fix', card);
        card.querySelector('[data-action="delete"]').onclick = ()=>deleteFact(f.factIndex);

        card.addEventListener('dragstart', e => {
          dragSrcFactIndex = f.factIndex;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(f.factIndex));
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.fact-card').forEach(c => c.classList.remove('drag-over'));
        });
        card.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (dragSrcFactIndex !== f.factIndex) {
            document.querySelectorAll('.fact-card').forEach(c => c.classList.remove('drag-over'));
            card.classList.add('drag-over');
          }
        });
        card.addEventListener('dragleave', e => {
          if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
        });
        card.addEventListener('drop', async e => {
          e.preventDefault();
          card.classList.remove('drag-over');
          if (dragSrcFactIndex === null || dragSrcFactIndex === f.factIndex) return;
          const cards = [...document.querySelectorAll('.fact-card')];
          const currentOrder = cards.map(c => parseInt(c.dataset.factIndex));
          const fromIdx = currentOrder.indexOf(dragSrcFactIndex);
          const toIdx = currentOrder.indexOf(f.factIndex);
          currentOrder.splice(fromIdx, 1);
          currentOrder.splice(toIdx, 0, dragSrcFactIndex);
          dragSrcFactIndex = null;
          try {
            await api('/api/fact/reorder', {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ file: currentFile, order: currentOrder })
            });
            showStatus('Reordered facts and rebuilt index.');
            await loadAll();
            await loadTown(currentFile);
          } catch(e){ showStatus(e.message, true); }
        });

        el.appendChild(card);
      });
      if(focusFactIndex !== null){
        setTimeout(()=>$(`fact-${focusFactIndex}`)?.scrollIntoView({behavior:'smooth', block:'center'}), 100);
      }
    }

    function cardValue(card, field){ return card.querySelector(`[data-field="${field}"]`)?.value || ''; }

    async function saveFact(factIndex, card){
      try{
        const sourceLabels = cardValue(card, 'sourceLabels').split(',').map(s=>s.trim()).filter(Boolean);
        await api('/api/fact/save', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ file: currentFile, factIndex, text: cardValue(card,'text'), source: cardValue(card,'source'), sourceLabels })
        });
        showStatus('Saved and rebuilt index.');
        await loadAll();
        await loadTown(currentFile, factIndex);
      } catch(e){ showStatus(e.message, true); }
    }

    async function reviewFact(factIndex, status, card){
      try{
        await api('/api/fact/review', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ file: currentFile, factIndex, status, notes: cardValue(card, 'notes') })
        });
        showStatus(`Marked ${status} and rebuilt index.`);
        await loadAll();
        await loadTown(currentFile, factIndex);
      } catch(e){ showStatus(e.message, true); }
    }

    async function deleteFact(factIndex){
      if(!confirm('Delete this fact? This writes directly to the JSON file.')) return;
      try{
        await api('/api/fact/delete', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ file: currentFile, factIndex })
        });
        showStatus('Deleted fact and rebuilt index.');
        await loadAll();
        await loadTown(currentFile);
      } catch(e){ showStatus(e.message, true); }
    }

    $('addFactBtn').onclick = async ()=>{
      if(!currentFile) return;
      const text = prompt('New fact text:');
      if(!text) return;
      const source = prompt('Source URL:') || '';
      try{
        await api('/api/fact/add', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ file: currentFile, text, source, sourceLabels: source ? ['Manual'] : [] })
        });
        showStatus('Added fact and rebuilt index.');
        await loadAll();
        await loadTown(currentFile);
      } catch(e){ showStatus(e.message, true); }
    };

    // ── Landmarks ──────────────────────────────────────────────────────────────

    async function loadLandmarks() {
      const idx = await api('/api/landmarks/index');
      lmCollections = idx.collections || [];
      renderLmList();
    }

    function renderLmList() {
      const list = $('list');
      list.innerHTML = '';
      $('summary').textContent = `${lmCollections.length} landmark collections`;
      if (!lmCollections.length) { list.innerHTML = '<div class="muted">No landmark collections found.</div>'; return; }
      const groups = {};
      for (const c of lmCollections) {
        const s = (c.state || '?').toUpperCase();
        if (!groups[s]) groups[s] = [];
        groups[s].push(c);
      }
      for (const state of Object.keys(groups).sort()) {
        const grp = document.createElement('div');
        grp.className = 'state-group';
        grp.innerHTML = `<div class="state-group-header">${esc(state)}</div>`;
        for (const c of groups[state]) {
          const fn = c.file.split('/').pop();
          const isActive = currentLmState === c.state && currentLmFile === fn;
          const btn = document.createElement('button');
          btn.className = isActive ? 'active' : '';
          btn.innerHTML = `<span class="town-title">${esc(c.region)}</span><span class="count">${c.landmarkCount} landmarks</span>`;
          btn.onclick = () => loadLmCollection(c.state, fn);
          grp.appendChild(btn);
        }
        list.appendChild(grp);
      }
    }

    async function loadLmCollection(state, file) {
      currentLmState = state;
      currentLmFile = file;
      currentLmData = await api(`/api/landmarks/${encodeURIComponent(state)}/${encodeURIComponent(file)}`);
      renderLmCollection();
      renderLmList();
    }

    function renderLmCollection() {
      const data = currentLmData;
      $('title').textContent = data.region || currentLmFile;
      $('subtitle').textContent = `${currentLmFile} · ${(data.landmarks||[]).length} landmarks`;
      $('addFactBtn').style.display = 'none';
      const el = $('facts');
      el.innerHTML = '';
      if (!(data.landmarks||[]).length) { el.innerHTML = '<div class="muted">No landmarks in this collection.</div>'; return; }
      (data.landmarks || []).forEach(lm => {
        const status = lm.review?.status || 'draft';
        const card = document.createElement('div');
        card.className = `landmark-card ${status === 'approved' ? 'approved' : 'draft'}`;
        card.id = `lm-${lm.id}`;
        const thumb = lm.image?.thumbUrl
          ? `<img class="lm-thumb" src="${esc(lm.image.thumbUrl)}" alt="${esc(lm.name)}" />`
          : '';
        const wikiSrc = (lm.sources || []).find(s => s.url);
        const wikiLink = wikiSrc
          ? `<a href="${esc(wikiSrc.url)}" target="_blank" rel="noopener" style="font-size:12px;line-height:2">Wikipedia ↗</a>`
          : '';
        const lat = lm.geometry?.latitude?.toFixed(5) ?? '';
        const lon = lm.geometry?.longitude?.toFixed(5) ?? '';
        card.innerHTML = `
          <div class="fact-head">
            <div>
              <b>${esc(lm.name)}</b><span class="lm-type">${esc(lm.landmarkType)}</span>
              <div class="lm-coords">${lat}, ${lon}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              ${thumb}
              <span class="lm-status-badge ${status === 'approved' ? 'approved' : 'draft'}" data-status-badge>${esc(status)}</span>
            </div>
          </div>
          <div class="field"><label>Commentary</label><textarea data-field="commentary">${esc(lm.commentaryTemplate || '')}</textarea></div>
          <div class="field"><label>Review notes</label><input data-field="notes" value="${esc(lm.review?.notes || '')}" placeholder="Optional notes" /></div>
          <div class="actions">
            <button class="primary" data-action="save">Save</button>
            ${wikiLink}
          </div>
        `;
        card.querySelector('[data-status-badge]').onclick = () => approveLandmark(lm.id, card, status);
        card.querySelector('[data-action="save"]').onclick = () => saveLandmark(lm.id, card);
        el.appendChild(card);
      });
    }

    async function saveLandmark(landmarkId, card) {
      try {
        const commentary = card.querySelector('[data-field="commentary"]')?.value || '';
        const notes = card.querySelector('[data-field="notes"]')?.value || '';
        await api('/api/landmark/save', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ state: currentLmState, file: currentLmFile, landmarkId, commentaryTemplate: commentary, reviewNotes: notes })
        });
        showStatus('Saved landmark.');
        await loadLmCollection(currentLmState, currentLmFile);
      } catch(e) { showStatus(e.message, true); }
    }

    async function approveLandmark(landmarkId, card, currentStatus) {
      const newStatus = currentStatus === 'approved' ? 'draft' : 'approved';
      try {
        const notes = card.querySelector('[data-field="notes"]')?.value || '';
        await api('/api/landmark/review', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ state: currentLmState, file: currentLmFile, landmarkId, status: newStatus, notes })
        });
        showStatus(`Marked ${newStatus}.`);
        await loadLmCollection(currentLmState, currentLmFile);
      } catch(e) { showStatus(e.message, true); }
    }

    // ── Bridges ────────────────────────────────────────────────────────────────

    let bridgeCandidates = [];
    let currentBridgeQid = null;
    let currentBridgeFacts = null;
    let currentBridgeExtractData = null;

    function setFiltersForMode(m) {
      const isBridges = m === 'bridges';
      const isLandmarks = m === 'landmarks';
      const hideStd = isBridges || isLandmarks;
      document.querySelector('.filters .row').style.display = hideStd ? 'none' : '';
      $('refreshBtn').style.display = hideStd ? 'none' : '';
      $('gitBtn').style.display = hideStd ? 'none' : '';
      $('bridgeFilters').style.display = isBridges ? 'block' : 'none';
      if (isBridges) $('summary').textContent = '';
    }

    function syncFactsFromDOM() {
      if (!currentBridgeFacts) return;
      document.querySelectorAll('.bridge-fact-textarea').forEach((ta, i) => {
        if (currentBridgeFacts[i]) currentBridgeFacts[i].text = ta.value;
      });
    }

    async function loadBridges() {
      bridgeCandidates = await api('/api/bridges/candidates');
      populateBridgeLocationFilters();
      renderBridgesList();
    }

    function populateBridgeLocationFilters() {
      const countries = [...new Set(bridgeCandidates.map(c => c.country).filter(Boolean))].sort();
      const cSel = $('bridgeCountryFilter');
      const cCurrent = cSel.value;
      cSel.innerHTML = '<option value="all">All countries</option>' + countries.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      if (countries.includes(cCurrent)) cSel.value = cCurrent;

      const states = [...new Set(bridgeCandidates.filter(c => c.country === 'US' && c.stateCode).map(c => c.stateCode))].sort();
      const sSel = $('bridgeStateFilter');
      const sCurrent = sSel.value;
      sSel.innerHTML = '<option value="all">All states</option>' + states.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      if (states.includes(sCurrent)) sSel.value = sCurrent;
      syncStateFilterVisibility();
    }

    function syncStateFilterVisibility() {
      const country = $('bridgeCountryFilter').value;
      const show = country === 'all' || country === 'US';
      $('bridgeStateFilter').style.display = show ? '' : 'none';
      if (!show) $('bridgeStateFilter').value = 'all';
    }

    function getFilteredBridges() {
      const decF = $('bridgeDecisionFilter').value;
      const typeF = $('bridgeTypeFilter').value;
      const countryF = $('bridgeCountryFilter').value;
      const stateF = $('bridgeStateFilter').value;
      const q = $('search').value.trim().toLowerCase();
      return bridgeCandidates.filter(c => {
        if (decF !== 'all') {
          const d = c.decision || 'undecided';
          if (d !== decF) return false;
        }
        if (typeF !== 'all' && c.structureType !== typeF) return false;
        if (countryF !== 'all' && c.country !== countryF) return false;
        if (stateF !== 'all' && c.stateCode !== stateF) return false;
        if (q && !c.label.toLowerCase().includes(q) && !c.wikidataQid.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function renderBridgesList() {
      const list = $('list');
      list.innerHTML = '';
      const visible = getFilteredBridges();
      const undecidedCount = visible.filter(c => !c.decision).length;
      const approveBtn = $('batchApproveBtn');
      const blockBtn = $('batchBlockBtn');
      const resetBtn = $('batchResetBtn');
      approveBtn.textContent = `✓ Approve all ${undecidedCount} undecided visible`;
      approveBtn.style.display = undecidedCount > 0 ? 'block' : 'none';
      blockBtn.textContent = `✗ Block all ${undecidedCount} undecided visible`;
      blockBtn.style.display = undecidedCount > 0 ? 'block' : 'none';
      resetBtn.textContent = `↺ Reset all ${visible.length} visible to undecided`;
      resetBtn.style.display = visible.length > 0 ? 'block' : 'none';
      $('summary').textContent = `${visible.length} of ${bridgeCandidates.length} candidates`;
      if (!visible.length) { list.innerHTML = '<div class="muted">No candidates match.</div>'; return; }
      visible.forEach(c => {
        const decLabel = c.decision || 'undecided';
        const div = document.createElement('div');
        div.className = `bridge-item${c.decision === 'approved' ? ' approved' : c.decision === 'blocked' ? ' blocked' : ''}${currentBridgeQid === c.wikidataQid ? ' active' : ''}`;
        div.dataset.qid = c.wikidataQid;
        div.innerHTML = `
          <div class="bridge-title">${esc(c.label)}</div>
          <div class="bridge-meta">
            <span class="bridge-type ${esc(c.structureType)}">${esc(c.structureType)}</span>
            <span class="bridge-decision ${esc(decLabel)}">${esc(decLabel)}</span>
            ${c.stateCode ? `<span class="bridge-type unknown">${esc(c.stateCode)}</span>` : c.country ? `<span class="bridge-type unknown">${esc(c.country)}</span>` : ''}
          </div>
          ${c.p31Values?.length ? `<div class="bridge-p31">${esc(c.p31Values.join(' · '))}</div>` : ''}
        `;
        div.onclick = () => loadBridgeCandidate(c.wikidataQid);
        list.appendChild(div);
      });
    }

    async function loadBridgeCandidate(qid) {
      currentBridgeQid = qid;
      currentBridgeFacts = null;
      currentBridgeExtractData = null;
      renderBridgesList();
      const candidate = bridgeCandidates.find(c => c.wikidataQid === qid);
      if (!candidate) return;
      renderBridgeDetail(candidate, null);
      try {
        const data = await api(`/api/bridges/candidate/${encodeURIComponent(qid)}/extract`);
        if (currentBridgeQid === qid) {
          currentBridgeFacts = data.facts || [];
          currentBridgeExtractData = data;
          renderBridgeDetail(candidate, data);
        }
      } catch(e) {
        if (currentBridgeQid === qid) renderBridgeDetail(candidate, { extract: '(failed to load extract)' });
      }
    }

    function renderBridgeDetail(candidate, extractData) {
      $('title').textContent = candidate.label;
      $('subtitle').textContent = `${candidate.wikidataQid} · ${candidate.id}`;
      $('addFactBtn').style.display = 'none';
      const decision = candidate.decision || 'undecided';
      const thumb = extractData?.thumbnail
        ? `<img class="bridge-thumbnail" src="${esc(extractData.thumbnail)}" alt="${esc(candidate.label)}" />`
        : '';
      const extractText = extractData === null ? '(loading…)' : (extractData?.extract || '(no extract available)');
      const p31Html = candidate.p31Values?.length
        ? candidate.p31Values.map(q => `<span class="bridge-type">${esc(q)}</span>`).join(' ')
        : '<span class="muted">none</span>';

      const cpValue = extractData?.connectingPointsDisplay ?? '';
      const cpSection = extractData !== null
        ? `<div class="bridge-connecting-row">
             <label>Connecting points:</label>
             <input type="text" id="bridgeCpInput" value="${esc(cpValue)}" placeholder="e.g. Brooklyn — Manhattan">
             <button class="small" id="saveBridgeCpBtn">Save</button>
             <span id="bridgeCpFeedback" style="display:none;font-size:12px;color:#1b5e20">Saved</span>
           </div>`
        : `<div class="bridge-connecting-row">
             <label>Connecting points:</label>
             <span style="font-size:13px;color:#aaa;font-style:italic">Loading…</span>
           </div>`;

      const facts = currentBridgeFacts;
      let factsHtml;
      if (extractData === null) {
        factsHtml = '<div class="bridge-fact-empty">Loading facts…</div>';
      } else if (extractData?.factsGenerationError) {
        factsHtml = `<div class="bridge-fact-empty">Generation failed: ${esc(extractData.factsGenerationError)}</div>`;
      } else if (!facts || !facts.length) {
        factsHtml = '<div class="bridge-fact-empty">No facts generated yet.</div>';
      } else {
        factsHtml = facts.map((f, i) => `
          <div class="bridge-fact-row">
            <span class="bridge-fact-num">${i + 1}</span>
            <textarea class="bridge-fact-textarea">${esc(f.text)}</textarea>
            <button class="bridge-fact-del" data-bridge-fact-del="${i}">×</button>
          </div>`).join('');
      }

      $('facts').innerHTML = `
        <div class="landmark-card">
          ${thumb}
          <div class="bridge-detail-meta">
            QID: <b>${esc(candidate.wikidataQid)}</b> &nbsp;·&nbsp; slug: <code>${esc(candidate.id)}</code> &nbsp;·&nbsp; type: ${esc(candidate.structureType)}${candidate.stateCode ? ` &nbsp;·&nbsp; state: ${esc(candidate.stateCode)}` : ''}${candidate.country ? ` &nbsp;·&nbsp; country: ${esc(candidate.country)}` : ''}
          </div>
          <div style="margin-bottom:10px"><b>P31 values:</b> ${p31Html}</div>
          <details style="margin-bottom:10px">
            <summary style="font-size:12px;color:#999;cursor:pointer">Wikipedia summary</summary>
            <div class="bridge-extract" style="margin-top:6px;font-size:12px;color:#666">${esc(extractText)}</div>
          </details>
          ${cpSection}
          <div class="bridge-facts-section">
            <div class="bridge-facts-header">
              <span>Facts (${facts ? facts.length : '…'})</span>
              <div style="display:flex;gap:6px">
                <button id="saveBridgeFactsBtn" class="primary small"${!facts ? ' disabled' : ''}>Save facts</button>
                <button id="regenBridgeFactsBtn" class="small"${extractData === null ? ' disabled' : ''}>Regenerate</button>
              </div>
            </div>
            ${factsHtml}
            ${facts ? '<button id="addBridgeFactBtn" class="small" style="margin-top:6px">+ Add fact</button>' : ''}
          </div>
          <div class="bridge-actions" style="margin-top:16px">
            <button class="approve-btn${decision === 'approved' ? ' active-decision' : ''}" id="bridgeApproveBtn">✓ Approve</button>
            <button class="undecided-btn${candidate.decision === 'undecided' ? ' active-decision' : ''}" id="bridgeUndecidedBtn">↺ Undecided</button>
            <button class="block-btn${decision === 'blocked' ? ' active-decision' : ''}" id="bridgeBlockBtn">✗ Block</button>
            <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(candidate.wikipediaTitle)}" target="_blank" rel="noopener" style="font-size:12px;line-height:2.5;margin-left:4px">Wikipedia ↗</a>
            <a href="https://www.wikidata.org/wiki/${esc(candidate.wikidataQid)}" target="_blank" rel="noopener" style="font-size:12px;line-height:2.5;margin-left:4px">Wikidata ↗</a>
          </div>
          <div class="bridge-history">Current decision: <b>${esc(decision)}</b></div>
        </div>
      `;

      // Wire delete buttons
      document.querySelectorAll('[data-bridge-fact-del]').forEach(btn => {
        const idx = parseInt(btn.dataset.bridgeFactDel);
        btn.onclick = () => {
          const ta = document.querySelectorAll('.bridge-fact-textarea')[idx];
          if (ta?.value.trim() && !confirm('Delete this fact?')) return;
          syncFactsFromDOM();
          currentBridgeFacts.splice(idx, 1);
          if (currentBridgeQid === candidate.wikidataQid) renderBridgeDetail(candidate, extractData);
        };
      });
      const addBtn = $('addBridgeFactBtn');
      if (addBtn) addBtn.onclick = () => {
        syncFactsFromDOM();
        currentBridgeFacts.push({ id: `f${currentBridgeFacts.length + 1}`, text: '' });
        if (currentBridgeQid === candidate.wikidataQid) renderBridgeDetail(candidate, extractData);
      };
      const cpSaveBtn = $('saveBridgeCpBtn');
      if (cpSaveBtn) cpSaveBtn.onclick = async () => {
        syncFactsFromDOM();
        const cp = $('bridgeCpInput')?.value.trim() || null;
        try {
          await api(`/api/bridges/candidate/${encodeURIComponent(candidate.wikidataQid)}/facts`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ facts: currentBridgeFacts ? currentBridgeFacts.filter(f => f.text.trim()) : [], connectingPointsDisplay: cp })
          });
          const fb = $('bridgeCpFeedback');
          if (fb) { fb.style.display = 'inline'; setTimeout(() => { fb.style.display = 'none'; }, 2000); }
        } catch(e) { showStatus(e.message, true); }
      };

      const saveBtn = $('saveBridgeFactsBtn');
      if (saveBtn) saveBtn.onclick = async () => {
        syncFactsFromDOM();
        const cp = $('bridgeCpInput')?.value.trim() || null;
        try {
          await api(`/api/bridges/candidate/${encodeURIComponent(candidate.wikidataQid)}/facts`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ facts: currentBridgeFacts.filter(f => f.text.trim()), connectingPointsDisplay: cp })
          });
          showStatus('Facts saved.');
        } catch(e) { showStatus(e.message, true); }
      };
      const regenBtn = $('regenBridgeFactsBtn');
      if (regenBtn) regenBtn.onclick = () => {
        showModal('Regenerate facts?', 'This will discard edits and re-generate all 3 facts from the Wikipedia article.', async () => {
          try {
            const data = await api(`/api/bridges/candidate/${encodeURIComponent(candidate.wikidataQid)}/extract?regen=true`);
            if (currentBridgeQid === candidate.wikidataQid) {
              currentBridgeFacts = data.facts || [];
              currentBridgeExtractData = data;
              renderBridgeDetail(candidate, data);
            }
            showStatus('Facts regenerated.');
          } catch(e) { showStatus(e.message, true); }
        });
      };
      $('bridgeApproveBtn').onclick = () => postBridgeDecision(candidate.wikidataQid, 'approved');
      $('bridgeUndecidedBtn').onclick = () => postBridgeDecision(candidate.wikidataQid, 'undecided');
      $('bridgeBlockBtn').onclick = () => postBridgeDecision(candidate.wikidataQid, 'blocked');
    }

    async function postBridgeDecision(qid, decision) {
      try {
        await api('/api/bridges/decision', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ wikidataQid: qid, decision, notes: '', decidedBy: 'Barry' })
        });
        // Capture next candidate BEFORE updating local state (decision change may remove from filter)
        const visibleBefore = getFilteredBridges();
        const idxBefore = visibleBefore.findIndex(c => c.wikidataQid === qid);
        const nextQid = visibleBefore[idxBefore + 1]?.wikidataQid ?? null;

        const c = bridgeCandidates.find(x => x.wikidataQid === qid);
        if (c) c.decision = decision;
        renderBridgesList();

        const label = decision === 'approved' ? 'Approved' : decision === 'blocked' ? 'Blocked' : 'Reset to undecided';
        if (nextQid) {
          showStatus(`${label}: ${c?.label}`);
          loadBridgeCandidate(nextQid);
        } else {
          // End of list — refresh current candidate display
          if (c) renderBridgeDetail(c, currentBridgeExtractData);
          showStatus(`${label}: ${c?.label} — end of list`);
        }
      } catch(e) { showStatus(e.message, true); }
    }

    function showModal(title, body, onConfirm) {
      $('modalTitle').textContent = title;
      $('modalBody').textContent = body;
      $('modalOverlay').style.display = 'flex';
      $('modalConfirm').onclick = () => { $('modalOverlay').style.display = 'none'; onConfirm(); };
      $('modalCancel').onclick = () => { $('modalOverlay').style.display = 'none'; };
    }

    async function batchDecide(targets, decision, label) {
      try {
        await api('/api/bridges/decisions/batch', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ qids: targets.map(c => c.wikidataQid), decision })
        });
        for (const c of targets) {
          const entry = bridgeCandidates.find(x => x.wikidataQid === c.wikidataQid);
          if (entry) entry.decision = decision;
        }
        renderBridgesList();
        showStatus(`${label}: ${targets.length} candidates.`);
      } catch(e) { showStatus(e.message, true); }
    }

    $('batchApproveBtn').onclick = () => {
      const undecided = getFilteredBridges().filter(c => !c.decision);
      if (!undecided.length) return;
      showModal(
        `Approve ${undecided.length} candidates?`,
        `This will mark all ${undecided.length} currently visible undecided candidates as approved.`,
        () => batchDecide(undecided, 'approved', 'Approved')
      );
    };

    $('batchBlockBtn').onclick = () => {
      const undecided = getFilteredBridges().filter(c => !c.decision);
      if (!undecided.length) return;
      showModal(
        `Block ${undecided.length} candidates?`,
        `This will mark all ${undecided.length} currently visible undecided candidates as blocked. Open any one and click Approve to undo individually.`,
        () => batchDecide(undecided, 'blocked', 'Blocked')
      );
    };

    $('batchResetBtn').onclick = () => {
      const visible = getFilteredBridges();
      if (!visible.length) return;
      showModal(
        `Reset ${visible.length} candidates to undecided?`,
        `This will clear the decision on all ${visible.length} currently visible candidates, including any already approved or blocked.`,
        () => batchDecide(visible, 'undecided', 'Reset')
      );
    };

    // ── Keyboard navigation (bridges mode) ────────────────────────────────────

    document.addEventListener('keydown', e => {
      if (mode !== 'bridges') return;
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if ($('modalOverlay').style.display !== 'none') return;
      const visible = getFilteredBridges();
      const idx = visible.findIndex(c => c.wikidataQid === currentBridgeQid);
      if (e.key === 'j' || e.key === 'ArrowDown') {
        e.preventDefault();
        const next = visible[idx + 1];
        if (next) loadBridgeCandidate(next.wikidataQid);
      } else if (e.key === 'k' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (idx > 0) loadBridgeCandidate(visible[idx - 1].wikidataQid);
      } else if (e.key === 'a' && currentBridgeQid) {
        postBridgeDecision(currentBridgeQid, 'approved');
      } else if (e.key === 'b' && currentBridgeQid) {
        postBridgeDecision(currentBridgeQid, 'blocked');
      } else if (e.key === 'u' && currentBridgeQid) {
        postBridgeDecision(currentBridgeQid, 'undecided');
      } else if (e.key === '/') {
        e.preventDefault();
        $('search').focus();
        $('search').select();
      }
    });

    // ── Tab handlers ───────────────────────────────────────────────────────────

    function setActiveTab(id) {
      ['tabProblems','tabAll','tabLandmarks','tabBridges'].forEach(t => $(t).classList.remove('active'));
      $(id).classList.add('active');
    }

    $('tabProblems').onclick = () => {
      mode = 'problems';
      setActiveTab('tabProblems');
      setFiltersForMode('problems');
      renderList();
    };
    $('tabAll').onclick = () => {
      mode = 'all';
      setActiveTab('tabAll');
      setFiltersForMode('all');
      renderList();
    };
    $('tabLandmarks').onclick = () => {
      mode = 'landmarks';
      setActiveTab('tabLandmarks');
      setFiltersForMode('landmarks');
      loadLandmarks().catch(e => showStatus(e.message, true));
    };
    $('tabBridges').onclick = () => {
      mode = 'bridges';
      setActiveTab('tabBridges');
      setFiltersForMode('bridges');
      loadBridges().catch(e => showStatus(e.message, true));
    };
    ['search','stateFilter','qaFilter'].forEach(id=>$(id).addEventListener('input', renderList));
    $('bridgeDecisionFilter').addEventListener('change', renderBridgesList);
    $('bridgeTypeFilter').addEventListener('change', renderBridgesList);
    $('bridgeCountryFilter').addEventListener('change', () => { syncStateFilterVisibility(); renderBridgesList(); });
    $('bridgeStateFilter').addEventListener('change', renderBridgesList);
    $('refreshBtn').onclick = async ()=>{ await loadAll(); if(currentFile) await loadTown(currentFile); showStatus('Refreshed.'); };
    $('gitBtn').onclick = async ()=>{
      try{
        const s = await api('/api/git-status');
        $('gitStatus').style.display = 'block';
        $('gitStatus').textContent = s.status || 'Working tree clean';
      } catch(e){ showStatus(e.message, true); }
    };

    $('publishBtn').onclick = async () => {
      const btn = $('publishBtn');
      const log = $('publishLog');
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      log.style.display = 'block';
      log.innerHTML = '';
      const stepEls = {};
      const appendLine = (html) => {
        const div = document.createElement('div');
        div.innerHTML = html;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      };
      try {
        const res = await fetch('/api/publish', { method: 'POST' });
        if (!res.ok) {
          const json = await res.json().catch(() => ({}));
          appendLine(`<span class="step-error">✗ ${esc(json.error || 'Request failed')}</span>`);
          btn.disabled = false; btn.textContent = 'Publish'; return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const event of events) {
            const line = event.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            let data; try { data = JSON.parse(line.slice(6)); } catch { continue; }
            if (data.type === 'step-start') {
              stepEls[data.name] = appendLine(`<span class="step-pending">⟳ ${esc(data.name)}…</span>`);
            } else if (data.type === 'step-output') {
              const stepEl = stepEls[data.name];
              if (stepEl) {
                let pre = stepEl.querySelector('pre.step-output');
                if (!pre) { pre = document.createElement('pre'); pre.className = 'step-output'; stepEl.appendChild(pre); }
                pre.textContent += data.line + '\n';
                log.scrollTop = log.scrollHeight;
              }
            } else if (data.type === 'step-done') {
              const cls = data.status === 'ok' ? 'step-ok' : data.status === 'skipped' ? 'step-skipped' : 'step-error';
              const icon = data.status === 'ok' ? '✓' : data.status === 'skipped' ? '—' : '✗';
              const outputHtml = data.output ? `<span class="step-output">${esc(data.output)}</span>` : '';
              const html = `<span class="${cls}">${icon} ${esc(data.name)}</span>${outputHtml}`;
              if (stepEls[data.name]) { stepEls[data.name].innerHTML = html; } else { appendLine(html); }
              log.scrollTop = log.scrollHeight;
            } else if (data.type === 'done') {
              if (data.noChanges) {
                appendLine('<span class="step-skipped">— Nothing to commit, working tree clean.</span>');
              } else if (data.success) {
                appendLine('<span class="step-ok" style="font-weight:bold">✓ Published successfully.</span>');
              } else {
                appendLine('<span class="step-error" style="font-weight:bold">✗ Publish failed — see details above.</span>');
              }
              btn.disabled = false; btn.textContent = 'Publish';
            }
          }
        }
      } catch(err) {
        appendLine(`<span class="step-error">✗ ${esc(err.message)}</span>`);
        btn.disabled = false; btn.textContent = 'Publish';
      }
    };

    loadAll().catch(e=>showStatus(e.message, true));
  </script>
</body>
</html>
